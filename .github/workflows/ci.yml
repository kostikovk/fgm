name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  setup-fgm:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build fgm from this commit
        run: go build -o "$RUNNER_TEMP/fgm-under-test" .
      - id: fgm
        uses: ./setup-fgm
        with:
          version: v0.0.0-ci
          fgm-binary: ${{ runner.temp }}/fgm-under-test
      - name: Verify the selected Go is on PATH
        env:
          WANT: ${{ steps.fgm.outputs.go-version }}
        run: |
          go version
          go version | grep -q "go$WANT "
          test "$GOTOOLCHAIN" = local
      - name: Check repository consistency
        run: fgm check

  setup-fgm-cache:
    needs: setup-fgm
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build -o "$RUNNER_TEMP/fgm-under-test" .
      - id: fgm
        uses: ./setup-fgm
        with:
          version: v0.0.0-ci
          fgm-binary: ${{ runner.temp }}/fgm-under-test
      - name: Expect the toolchain cache saved by the previous job
        env:
          CACHE_HIT: ${{ steps.fgm.outputs.cache-hit }}
        run: test "$CACHE_HIT" = true
